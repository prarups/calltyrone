; =====================================================================
;  CALL TYRONE - WEBSITE SETTINGS
; ---------------------------------------------------------------------
;  HOW TO EDIT:
;   1. Open this file (on the server: public_html/settings.ini)
;   2. Change ONLY the value after the "=" sign
;   3. Save, then refresh the website. No rebuild needed.
;
;  RULES:
;   - Lines starting with ";" are comments (ignored).
;   - Do not use quotes. Leave a value empty to keep the built-in default.
;   - US numbers: write them any way, e.g. (404) 482-2246 or 404-482-2246.
;     +1 is added automatically for 10-digit numbers.
;   - This file is PUBLIC. Never put passwords here.
; =====================================================================

[contact]
; Main dispatch number shown on every Call button
phone = (404) 482-2246

; Backup / toll-free number shown on the Contact section
backup_phone = (404) 482-2246

; Email shown on the website (Contact section, Footer, download guide)
email = Tyronne@call-tyrone.com

; Customer support email shown on the Contact section
support_email = Tyronne@call-tyrone.com


[forms]
; INBOX THAT RECEIVES ALL FORM REQUESTS (free service: FormSubmit).
;
; FIRST TIME with a new inbox: submit one test form on the website. FormSubmit
; emails an "Activate Form" link to this inbox (check Spam too). Click it ONCE.
; After that every request arrives normally.
;
; Currently the client inbox. Change it here any time (no rebuild needed).
receive_email = Tyronne@call-tyrone.com
